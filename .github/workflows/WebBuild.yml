name: WebBuild

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        cd ./src/blogFronted
        curl -o "./src/assets/js/prism.js" "https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"
        curl -o "./src/assets/css/prism.css" "https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
        npm install
        npm run build
